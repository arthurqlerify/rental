  /get-all-rent-charges:
    get:
      summary: Get All Rent Charges
      description: Lists rent charges with what is owed on each, overdue charges first and then the newest.
      operationId: getAllRentCharges
      tags:
        - RentalManagementService
      parameters:
        - $ref: '#/components/parameters/RentPropertyIdFilter'
        - $ref: '#/components/parameters/RentLeaseIdFilter'
        - $ref: '#/components/parameters/RentAsOf'
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                type: array
                items:
