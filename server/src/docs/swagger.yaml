  /issue-rent-charges:
    post:
      summary: Issue Rent Charges
      description: "Charges the month's rent to every lease that runs on at least one day of the month: one charge per lease, due on the 1st, for the lease's current rent. A lease that starts or ends during the month is charged only for the days it runs, and credit the lease has left goes to the new charge. A lease already charged for the month is not charged again and is listed in refused. When no lease could be charged the request is refused."
      operationId: issueRentCharges
      tags:
        - RentalManagementService
      responses:
        '200':
          description: 'OK: The charges were issued.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueRentChargesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRentChargesRequest'
  /record-rent-payment:
    post:
      summary: Record Rent Payment
      description: "Records a payment against a lease. Part payments are allowed. The payment pays the lease's oldest unpaid charge first, and anything paid beyond what is owed is kept as credit for the next charge."
      operationId: recordRentPayment
      tags:
        - RentalManagementService
      responses:
        '200':
          description: 'OK: The payment was recorded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentPayment'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
