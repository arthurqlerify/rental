    IssueRentChargesResult:
      type: object
      properties:
        month:
          type: string
          example: '2026-11'
        issued:
          type: array
          items:
            $ref: '#/components/schemas/RentCharge'
        refused:
          type: array
          description: Active leases that were not charged, such as those already charged for the month.
          items:
            type: object
            properties:
              leaseId:
                type: string
              tenantName:
                type: string
              reason:
                type: string
                example: Rent for this month has already been charged.
    RecordRentPaymentRequest:
      type: object
      properties:
        leaseId:
          type: string
          example: lease-1001
        amount:
          type: string
          description: A positive amount with at most two decimals, as a number or a number string.
          example: '1500'
        paidOn:
          type: string
          example: '2026-11-03'
        method:
          type: string
          enum:
            - BankTransfer
            - Card
            - Cash
          example: BankTransfer
      required:
        - leaseId
        - amount
        - paidOn
        - method
    WaiveRentChargeRequest:
      type: object
      properties:
        id:
          type: string
          description: The id of the rent charge.
          example: 0b9c3c1e-6a43-4f0e-9a51-2f3a1c7d9e10
        reason:
          type: string
          example: No heating for most of November
      required:
        - id
        - reason
