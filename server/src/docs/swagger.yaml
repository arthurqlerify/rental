      summary: Get All Apartments
      description: Retrieves data based on the "Get All Apartments" query. This is a synchronous query operation.
      operationId: getAllApartments
      tags:
        - RentalManagementService
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                type: array
                items:
