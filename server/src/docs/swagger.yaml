                items:
                  $ref: '#/components/schemas/LeaseBalance'
        '400':
          $ref: '#/components/responses/BadRequest'
  /get-rent-summary:
    get:
      summary: Get Rent Summary
      description: Totals the outstanding and overdue rent across all leases and counts the overdue leases.
      operationId: getRentSummary
      tags:
        - RentalManagementService
      parameters:
        - $ref: '#/components/parameters/RentAsOf'
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: An error occurred.
    Lease:
      type: object
      description: Represents a Lease in the system.
      properties:
        id:
          type: string
          description: Unique identifier for the Lease (primary key).
          example: lease-1001
        apartmentId:
          type: string
          description: The apartmentId of the Lease.
          example: apt-22B
        startDate:
          type: string
          description: The day the Lease starts (YYYY-MM-DD). Rent for the month it starts is charged from this day.
          example: '2024-10-01'
        endDate:
          type: string
          description: The endDate of the Lease.
          example: '2025-09-30'
        noticeDate:
          type: string
          description: The noticeDate of the Lease.
          example: '2025-08-01'
        currentRent:
          type: string
          description: The currentRent of the Lease.
          example: '1450'
        propertyId:
          type: string
          description: The propertyId of the Lease.
          example: prop-001
        nextActorEmail:
          type: string
          description: The nextActorEmail of the Lease.
          example: ops@rentco.com
        moveOutConfirmedAt:
          type: string
          description: The moveOutConfirmedAt of the Lease.
          example: 2025-09-30T10:00
        turnoverId:
          type: string
          description: The turnoverId of the Lease.
          example: to-5001
        tenantName:
          type: string
          description: The tenantName of the Lease.
          example: Alexandra Nguyen
      required:
        - id
        - apartmentId
        - endDate
        - noticeDate
        - currentRent
        - propertyId
        - moveOutConfirmedAt
        - turnoverId
        - tenantName
    Turnover:
      type: object
      description: Represents a Turnover in the system.
      properties:
        id:
          type: string
          description: Unique identifier for the Turnover (primary key).
          example: to-5001
        leaseId:
          type: string
          description: The leaseId of the Turnover.
          example: lease-1001
        apartmentId:
          type: string
          description: The apartmentId of the Turnover.
          example: apt-22B
        targetReadyDate:
          type: string
          description: The targetReadyDate of the Turnover.
          example: '2025-10-15'
        propertyId:
          type: string
          description: The propertyId of the Turnover.
          example: prop-001
        nextActorEmail:
          type: string
          description: The nextActorEmail of the Turnover.
          example: inspections@rentco.com
        vacatedAt:
          type: string
          description: The vacatedAt of the Turnover.
          example: 2025-09-30T12:00
        keysReturned:
          type: string
          description: The keysReturned of the Turnover.
          example: 'true'
        notes:
          type: string
          description: The notes of the Turnover.
          example: No issues
        readyToRentDate:
          type: string
          description: The readyToRentDate of the Turnover.
          example: '2025-10-20'
        listingReady:
          type: string
          description: The listingReady of the Turnover.
          example: 'true'
        marketingEmail:
          type: string
          description: The marketingEmail of the Turnover.
          example: list@rentco.com
        finalInspectionPassedAt:
          type: string
          description: The finalInspectionPassedAt of the Turnover.
          example: 2025-10-19T15:30
        openWorkOrdersCount:
          type: string
          description: The openWorkOrdersCount of the Turnover.
          example: '0'
        leaseEndDate:
          type: string
          description: The leaseEndDate of the Turnover.
          example: '2025-09-30'
        checklist:
          type: string
          description: The checklist of the Turnover.
          example: Move-out inspection done
      required:
        - id
        - leaseId
        - apartmentId
        - targetReadyDate
        - propertyId
        - vacatedAt
        - keysReturned
        - readyToRentDate
    Inspection:
      type: object
      description: Represents a Inspection in the system.
      properties:
        id:
          type: string
          description: Unique identifier for the Inspection (primary key).
          example: insp-9001
        turnoverId:
          type: string
          description: The turnoverId of the Inspection.
          example: to-5001
        apartmentId:
          type: string
          description: The apartmentId of the Inspection.
          example: apt-22B
        scheduledAt:
          type: string
          description: The scheduledAt of the Inspection.
          example: 2025-09-28T09:00
        assignedToEmail:
          type: string
          description: The assignedToEmail of the Inspection.
          example: inspector1@rentco.com
        inspectorName:
          type: string
          description: The inspectorName of the Inspection.
          example: A. Rivera
        locationNotes:
          type: string
          description: The locationNotes of the Inspection.
          example: Basement entry
        nextActorEmail:
          type: string
          description: The nextActorEmail of the Inspection.
