            type: string
  /get-all-inspections:
    get:
      summary: Get All Inspections
      description: Retrieves data based on the "Get All Inspections" query. This is a synchronous query operation.
      operationId: getAllInspections
      tags:
        - RentalManagementService
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inspection'
        '400':
          $ref: '#/components/responses/BadRequest'
  /get-all-renovation-cases:
    get:
      summary: Get All Renovation Cases
      description: Retrieves data based on the "Get All Renovation Cases" query. This is a synchronous query operation.
      operationId: getAllRenovationCases
      tags:
        - RentalManagementService
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RenovationCase'
        '400':
          $ref: '#/components/responses/BadRequest'
  /get-all-work-orders:
    get:
      summary: Get All Work Orders
      description: Retrieves data based on the "Get All Work Orders" query. This is a synchronous query operation.
      operationId: getAllWorkOrders
      tags:
        - RentalManagementService
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
  /get-all-propertys:
    get:
      summary: Get All Propertys
      description: Retrieves data based on the "Get All Propertys" query. This is a synchronous query operation.
      operationId: getAllPropertys
      tags:
        - RentalManagementService
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
        '400':
          $ref: '#/components/responses/BadRequest'
  /charge-rent:
    post:
      summary: Charge Rent
      description: Executes the "Charge Rent" command. Charges one lease for one month, due on the 1st (or on the lease's start date when it starts later in the month), for the lease's current rent. A lease that starts or ends during the month is charged only for the days it runs. Refused when the lease has already been charged for the month or does not run during it.
      operationId: chargeRent
      tags:
        - RentalManagementService
      responses:
        '200':
          description: 'OK: The rent charge was created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentCharge'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRentRequest'
  /issue-monthly-rent-charges:
    post:
      summary: Issue Monthly Rent Charges
      description: Executes the "Issue Monthly Rent Charges" command. Charges every lease that runs during the month and has not been charged for it yet, in one step. Leases already charged for the month are listed under skipped. Refused when no lease could be charged, for example because the month has already been charged for every active lease.
      operationId: issueMonthlyRentCharges
      tags:
        - RentalManagementService
      responses:
        '200':
          description: 'OK: The month''s rent charges were created.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueMonthlyRentChargesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueMonthlyRentChargesRequest'
  /record-rent-payment:
    post:
      summary: Record Rent Payment
      description: Executes the "Record Rent Payment" command. Part payments are allowed. A lease's payments pay its oldest unpaid charge first, and anything paid beyond what is owed is kept as credit for the next charge.
      operationId: recordRentPayment
      tags:
        - RentalManagementService
      responses:
        '200':
          description: 'OK: The payment was recorded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentPayment'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRentPaymentRequest'
  /waive-rent-charge:
    post:
      summary: Waive Rent Charge
      description: Executes the "Waive Rent Charge" command. Nothing is owed for a waived charge; anything already paid towards it goes to the next unpaid charge or is kept as credit. Refused without a reason, or when the charge is already waived or fully paid.
      operationId: waiveRentCharge
      tags:
        - RentalManagementService
      responses:
        '200':
          description: 'OK: The rent charge was waived.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentCharge'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiveRentChargeRequest'
  /get-all-rent-charges:
    get:
      summary: Get All Rent Charges
      description: Retrieves every rent charge with what has been paid towards it, what is outstanding and whether it is overdue (not fully paid 5 days after its due date). Overdue charges come first, then the newest month first.
      operationId: getAllRentCharges
      tags:
        - RentalManagementService
      parameters:
        - $ref: '#/components/parameters/RentPropertyIdFilter'
        - $ref: '#/components/parameters/RentLeaseIdFilter'
        - $ref: '#/components/parameters/RentAsOf'
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentChargeEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
  /get-all-rent-payments:
    get:
      summary: Get All Rent Payments
      description: Retrieves every rent payment, the most recently paid first.
      operationId: getAllRentPayments
      tags:
        - RentalManagementService
      parameters:
        - $ref: '#/components/parameters/RentPropertyIdFilter'
        - $ref: '#/components/parameters/RentLeaseIdFilter'
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentPayment'
        '400':
          $ref: '#/components/responses/BadRequest'
  /get-all-lease-balances:
    get:
      summary: Get All Lease Balances
      description: Retrieves each lease's rent balance - what is owed, how much of it is overdue and any credit. Overdue leases come first, the most overdue at the top.
      operationId: getAllLeaseBalances
      tags:
        - RentalManagementService
      parameters:
        - $ref: '#/components/parameters/RentPropertyIdFilter'
        - $ref: '#/components/parameters/RentLeaseIdFilter'
        - $ref: '#/components/parameters/RentAsOf'
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaseBalance'
        '400':
          $ref: '#/components/responses/BadRequest'
  /get-rent-summary:
    get:
      summary: Get Rent Summary
      description: Retrieves the total rent outstanding and overdue across every property, and how many leases are overdue.
      operationId: getRentSummary
      tags:
        - RentalManagementService
      parameters:
        - $ref: '#/components/parameters/RentAsOf'
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: An error occurred.
    Lease:
      type: object
      description: Represents a Lease in the system.
      properties:
        id:
          type: string
          description: Unique identifier for the Lease (primary key).
          example: lease-1001
        apartmentId:
          type: string
          description: The apartmentId of the Lease.
          example: apt-22B
        startDate:
          type: string
          description: The day the lease starts. Rent for a month the lease starts in only counts the days from it.
          example: '2025-04-01'
        endDate:
          type: string
          description: The endDate of the Lease.
          example: '2025-09-30'
        noticeDate:
          type: string
          description: The noticeDate of the Lease.
          example: '2025-08-01'
        currentRent:
          type: string
          description: The currentRent of the Lease.
          example: '1450'
        propertyId:
          type: string
          description: The propertyId of the Lease.
          example: prop-001
        nextActorEmail:
          type: string
          description: The nextActorEmail of the Lease.
          example: ops@rentco.com
        moveOutConfirmedAt:
          type: string
          description: The moveOutConfirmedAt of the Lease.
          example: 2025-09-30T10:00
        turnoverId:
          type: string
          description: The turnoverId of the Lease.
          example: to-5001
        tenantName:
          type: string
          description: The tenantName of the Lease.
          example: Alexandra Nguyen
      required:
        - id
        - apartmentId
        - endDate
        - noticeDate
        - currentRent
        - propertyId
        - moveOutConfirmedAt
        - turnoverId
        - tenantName
    Turnover:
      type: object
      description: Represents a Turnover in the system.
      properties:
        id:
          type: string
          description: Unique identifier for the Turnover (primary key).
          example: to-5001
        leaseId:
          type: string
          description: The leaseId of the Turnover.
          example: lease-1001
        apartmentId:
          type: string
          description: The apartmentId of the Turnover.
          example: apt-22B
        targetReadyDate:
          type: string
          description: The targetReadyDate of the Turnover.
          example: '2025-10-15'
        propertyId:
          type: string
          description: The propertyId of the Turnover.
          example: prop-001
        nextActorEmail:
          type: string
          description: The nextActorEmail of the Turnover.
          example: inspections@rentco.com
        vacatedAt:
          type: string
          description: The vacatedAt of the Turnover.
          example: 2025-09-30T12:00
        keysReturned:
          type: string
          description: The keysReturned of the Turnover.
          example: 'true'
        notes:
          type: string
          description: The notes of the Turnover.
          example: No issues
        readyToRentDate:
          type: string
          description: The readyToRentDate of the Turnover.
          example: '2025-10-20'
        listingReady:
          type: string
          description: The listingReady of the Turnover.
          example: 'true'
        marketingEmail:
          type: string
          description: The marketingEmail of the Turnover.
          example: list@rentco.com
        finalInspectionPassedAt:
          type: string
          description: The finalInspectionPassedAt of the Turnover.
          example: 2025-10-19T15:30
        openWorkOrdersCount:
          type: string
          description: The openWorkOrdersCount of the Turnover.
          example: '0'
        leaseEndDate:
          type: string
          description: The leaseEndDate of the Turnover.
          example: '2025-09-30'
        checklist:
          type: string
          description: The checklist of the Turnover.
          example: Move-out inspection done
      required:
        - id
        - leaseId
        - apartmentId
        - targetReadyDate
        - propertyId
        - vacatedAt
        - keysReturned
        - readyToRentDate
