    RentCharge:
      type: object
      description: One month's rent charged to a lease.
      properties:
        id:
          type: string
          example: 0b9c3c1e-6a43-4f0e-9a51-2f3a1c7d9e10
        leaseId:
          type: string
          example: lease-1001
        propertyId:
          type: string
          example: prop-001
        apartmentId:
          type: string
          example: apt-22B
        tenantName:
          type: string
          example: Alexandra Nguyen
        month:
          type: string
          description: The month charged (YYYY-MM).
          example: '2026-11'
        dueDate:
          type: string
          description: The 1st of the month.
          example: '2026-11-01'
        periodStart:
          type: string
          description: The first day of the month the lease runs.
          example: '2026-11-01'
        periodEnd:
          type: string
          description: The last day of the month the lease runs.
          example: '2026-11-30'
        daysCharged:
          type: integer
          example: 30
        daysInMonth:
          type: integer
          example: 30
        monthlyRent:
          type: number
          description: The lease's current rent when the charge was issued.
          example: 1450
        amount:
          type: number
          description: The rent charged, for the days charged.
          example: 1450
        amountPaid:
          type: number
          description: What has been paid on the charge, credit included.
          example: 0
        creditApplied:
          type: number
          description: The lease's credit that went to the charge when it was issued.
          example: 0
        issuedAt:
          type: string
          example: '2026-11-01T08:00:00.000Z'
        waivedAt:
          type: string
          example: '2026-11-04T09:30:00.000Z'
        waivedReason:
          type: string
          example: No heating for most of November
        waivedAmount:
          type: number
          description: What was still owed when the charge was waived.
          example: 1450
      required:
        - id
        - leaseId
        - month
        - dueDate
        - amount
        - amountPaid
    RentChargeView:
      description: A rent charge with what is owed on it, as of the day asked about.
      allOf:
        - $ref: '#/components/schemas/RentCharge'
        - type: object
          properties:
            owed:
              type: number
              description: What is still owed. Nothing is owed on a waived charge.
              example: 1450
            overdueFrom:
              type: string
              description: The day the charge becomes overdue if it is not fully paid, 5 days after its due date.
              example: '2026-11-06'
            isOverdue:
              type: boolean
              example: false
            status:
              type: string
              enum:
                - Unpaid
                - Part paid
                - Overdue
                - Paid
                - Waived
              example: Unpaid
    RentPayment:
      type: object
      description: A payment recorded against a lease.
      properties:
        id:
          type: string
          example: 5d1f4a2b-3c6e-4d7f-8a9b-0c1d2e3f4a5b
        leaseId:
          type: string
          example: lease-1001
        propertyId:
          type: string
          example: prop-001
        apartmentId:
          type: string
          example: apt-22B
        tenantName:
          type: string
          example: Alexandra Nguyen
        amount:
          type: number
          example: 1500
        paidOn:
          type: string
          example: '2026-11-03'
        method:
          type: string
          enum:
            - BankTransfer
            - Card
            - Cash
          example: BankTransfer
        allocations:
          type: array
          description: The charges the payment paid, oldest first.
          items:
            type: object
            properties:
              chargeId:
                type: string
              month:
                type: string
                example: '2026-11'
              amount:
                type: number
                example: 1450
        creditAmount:
          type: number
          description: What was paid beyond what was owed, kept as credit for the next charge.
          example: 50
        recordedAt:
          type: string
          example: '2026-11-03T10:15:00.000Z'
      required:
        - id
        - leaseId
        - amount
        - paidOn
        - method
        - allocations
        - creditAmount
