  /get-lease-by-id/{id}:
    get:
      summary: Get Lease by ID
      description: Retrieves data based on the "Get Lease by ID" query. This is a synchronous query operation.
      operationId: getLeaseByID
      tags:
        - RentalManagementService
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
  /get-all-leases:
    get:
      summary: Get All Leases
      description: Retrieves data based on the "Get All Leases" query. This is a synchronous query operation.
      operationId: getAllLeases
      tags:
        - RentalManagementService
      responses:
        '200':
          description: Successful retrieval of data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lease'
        '400':
          $ref: '#/components/responses/BadRequest'
  /get-all-turnovers:
