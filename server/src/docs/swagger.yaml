    RentCharge:
      type: object
      description: One month's rent charged to a lease. Amounts are strings with two decimals.
      properties:
        id:
          type: string
          description: Unique identifier for the Rent Charge (primary key).
          example: 8c1f6a2e-5b0d-4f7a-9d3e-2a6b1c4d5e6f
        leaseId:
          type: string
          example: lease-1001
        propertyId:
          type: string
          example: prop-001
        apartmentId:
          type: string
          example: apt-22B
        tenantName:
          type: string
          example: Alexandra Nguyen
        month:
          type: string
          description: The month charged, as YYYY-MM.
          example: '2025-10'
        dueDate:
          type: string
          description: The 1st of the month, or the lease's start date when it starts later in the month.
          example: '2025-10-01'
        amount:
          type: string
          description: The lease's current rent, or its share for the days the lease runs in the month.
          example: '1450.00'
        daysCharged:
          type: integer
          description: The days of the month the lease runs.
          example: 31
        daysInMonth:
          type: integer
          example: 31
        issuedAt:
          type: string
          example: '2025-10-01T08:00:00.000Z'
        waivedAt:
          type: string
          description: Set when the charge is waived.
          example: '2025-10-12T09:30:00.000Z'
        waiverReason:
          type: string
          example: Burst pipe left the flat unusable for the month
      required:
        - id
        - leaseId
        - month
        - dueDate
        - amount
    RentChargeEntry:
      description: A rent charge with what has been paid towards it on the asOf date.
      allOf:
        - $ref: '#/components/schemas/RentCharge'
        - type: object
          properties:
            amountPaid:
              type: string
              example: '400.00'
            outstanding:
              type: string
              description: What is still owed for the charge; 0.00 when paid or waived.
              example: '1050.00'
            status:
              type: string
              enum: [Unpaid, Partly paid, Paid, Waived]
              example: Partly paid
            overdue:
              type: boolean
              description: True when part of the charge is still unpaid 5 days after its due date.
              example: true
            overdueFrom:
              type: string
              description: The date the charge becomes overdue if not fully paid.
              example: '2025-10-06'
    RentPayment:
      type: object
      description: A rent payment made for a lease.
      properties:
        id:
          type: string
          description: Unique identifier for the Rent Payment (primary key).
          example: 2b7e9c1d-3f4a-4e5b-8c6d-7a8b9c0d1e2f
        leaseId:
          type: string
          example: lease-1001
        propertyId:
          type: string
          example: prop-001
        apartmentId:
          type: string
          example: apt-22B
        tenantName:
          type: string
          example: Alexandra Nguyen
        amount:
          type: string
          example: '400.00'
        paidOn:
          type: string
          example: '2025-10-03'
        method:
          type: string
          enum: [Bank transfer, Card, Cash]
          example: Bank transfer
        recordedAt:
          type: string
          example: '2025-10-03T14:12:00.000Z'
      required:
        - id
        - leaseId
        - amount
        - paidOn
        - method
    LeaseBalance:
      type: object
      description: A lease's rent balance on the asOf date.
      properties:
        leaseId:
          type: string
          example: lease-1001
        tenantName:
          type: string
          example: Alexandra Nguyen
        propertyId:
          type: string
          example: prop-001
        apartmentId:
          type: string
          example: apt-22B
        owed:
          type: string
          description: Everything still owed for the lease's charges.
          example: '2050.00'
        overdue:
          type: string
          description: The part of what is owed that is overdue.
          example: '600.00'
        credit:
          type: string
          description: Paid beyond what is owed, kept for the next charge.
          example: '0.00'
        status:
          type: string
          enum: [Overdue, Owing, In credit, Paid up]
          example: Overdue
      required:
        - leaseId
        - owed
        - overdue
        - credit
        - status
    RentSummary:
      type: object
      properties:
        asOf:
          type: string
          example: '2025-10-10'
        totalOutstanding:
          type: string
          example: '5400.00'
        totalOverdue:
          type: string
          example: '1200.00'
        overdueLeasesCount:
          type: integer
          example: 2
      required:
        - asOf
        - totalOutstanding
        - totalOverdue
        - overdueLeasesCount
    IssueMonthlyRentChargesResult:
      type: object
      properties:
        month:
          type: string
          example: '2025-10'
        charged:
          type: array
          items:
            $ref: '#/components/schemas/RentCharge'
        skipped:
          type: array
          description: Active leases that were not charged, with the reason.
          items:
            type: object
            properties:
              leaseId:
                type: string
                example: lease-1001
              tenantName:
                type: string
                example: Alexandra Nguyen
              reason:
                type: string
                example: Rent for 2025-10 has already been charged for lease lease-1001.
    ChargeRentRequest:
      type: object
      properties:
        leaseId:
          type: string
          example: lease-1001
        month:
          type: string
          description: The month to charge, as YYYY-MM.
          example: '2025-10'
      required:
        - leaseId
        - month
    IssueMonthlyRentChargesRequest:
      type: object
      properties:
        month:
          type: string
          description: The month to charge, as YYYY-MM.
          example: '2025-10'
      required:
        - month
    RecordRentPaymentRequest:
      type: object
      properties:
        leaseId:
          type: string
          example: lease-1001
        amount:
          type: string
          description: More than 0, with at most two decimals.
          example: '400'
        paidOn:
          type: string
          description: The date paid, as YYYY-MM-DD.
          example: '2025-10-03'
        method:
          type: string
          enum: [Bank transfer, Card, Cash]
          example: Bank transfer
      required:
        - leaseId
        - amount
        - paidOn
        - method
    WaiveRentChargeRequest:
      type: object
      properties:
        id:
          type: string
          description: The rent charge to waive.
          example: 8c1f6a2e-5b0d-4f7a-9d3e-2a6b1c4d5e6f
        reason:
          type: string
          example: Burst pipe left the flat unusable for the month
      required:
        - id
        - reason
